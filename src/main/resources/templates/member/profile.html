<!DOCTYPE html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <title th:text="${profile.nickname} + '님의 프로필 - TempFit'">
      프로필
    </title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <link th:href="@{/css/profile.css}" rel="stylesheet" />
    <link th:href="@{/css/detail.css}" rel="stylesheet" />
    <link th:href="@{/css/chatfrag.css}" rel="stylesheet" />
  </head>
  <body>
    <th:block th:replace="fragments/navbar :: navbar"></th:block>

    <button
      class="chat-btn shadow-sm"
      id="chat-btn"
      data-bs-toggle="offcanvas"
      data-bs-target="#offcanvasBottom"
      aria-controls="offcanvasBottom"
      sec:authorize="isAuthenticated()"
    >
      <span class="chatTitle">
        <i class="bi bi-chat-dots"></i>
      </span>
      <i class="chatToggle bi bi-chevron-double-up"></i>
    </button>
    <div
      class="offcanvas offcanvas-bottom shadow-sm"
      tabindex="-1"
      id="offcanvasBottom"
      data-bs-backdrop="false"
      data-bs-scroll="true"
      sec:authorize="isAuthenticated()"
    >
      <div class="offcanvas-body" id="offcanvas-body"></div>
    </div>

    <main class="profile-page container">
      <div class="profile-top">
        <!-- 프로필 이미지 + 업로드/삭제 -->
        <div
          class="profile-container"
          th:classappend="${isOwner} ? '' : 'pe-none'"
        >
          <!-- file input은 화면에는 숨김, 클릭 시 실행 (owner만 허용하려면 JS에서 확인) -->
          <div class="profile-image-wrapper">
            <img
              id="profileImg"
              class="profile-image"
              th:src="${profile != null && profile.profileImageUrl != null ? profile.profileImageUrl : '/images/default.png'}"
              alt="프로필 이미지"
            />
          </div>
        </div>

        <!-- 프로필 정보 -->
        <div class="profile-info ms-3">
          <h2 th:text="${profile.nickname}">닉네임</h2>
          <div class="text-muted" th:text="${profile.email}">이름</div>

          <div class="profile-stats">
            <div class="stat">
              팔로워:
              <strong id="followerCount" th:text="${followerCount}">0</strong>
            </div>
            <div class="stat">
              팔로잉:
              <strong id="followingCount" th:text="${followingCount}">0</strong>
            </div>
          </div>

          <div class="follow-buttons" sec:authorize="isAuthenticated()">
            <!-- 소유자면 프로필 수정 링크 -->
            <a
              th:if="${isOwner}"
              class="btn btn-outline-primary btn-sm"
              th:href="@{/member/mychange}"
              >프로필 수정</a
            >

            <!-- 다른 사용자일 때 팔로우/언팔로우 버튼 -->
            <div th:unless="${isOwner}">
              <form
                th:action="@{/follow/{id}(id=${profile.email})}"
                method="post"
              >
                <button
                  id="followBtn"
                  type="submit"
                  class="btn btn-primary btn-sm"
                  th:if="${!isFollowing}"
                >
                  팔로우
                </button>
              </form>
              <form
                th:action="@{/follow/{id}(id=${profile.email})}"
                method="post"
              >
                <button
                  id="unfollowBtn"
                  type="submit"
                  class="btn btn-secondary btn-sm"
                  th:if="${isFollowing}"
                >
                  언팔로우
                </button>
              </form>
            </div>
            <div class="mt-3">
              <form
                th:action="@{/messages/{id}(id=${profile.email})}"
                method="get"
              >
                <button
                  id="chatBtn"
                  type="submit"
                  class="btn btn-outline-primary btn-like btn-sm"
                >
                  채팅
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>

      <div class="post-list">
        <h4>게시글</h4>
        <div class="post-table bg-white p-3">
          <table
            class="table table-hover align-middle mb-0"
            th:if="${#lists.size(posts) > 0}"
          >
            <thead class="table-light">
              <tr>
                <th>내용</th>
                <th>작성일</th>
                <th>추천수</th>
              </tr>
            </thead>
            <tbody>
              <tr
                th:each="post : ${posts}"
                class="posts post-card"
                style="cursor: pointer"
                th:attr="data-id=${post.id}"
              >
                <td th:text="${post.content}">내용</td>
                <td
                  th:text="${#temporals.format(post.createdDate, 'yyyy-MM-dd')}"
                >
                  날짜
                </td>
                <td th:text="${post.recommendCount}">0</td>
              </tr>
            </tbody>
          </table>

          <!-- 글이 하나도 없을 때 -->
          <div class="no-posts" th:if="${#lists.size(posts) == 0}">
            아직 작성한 게시글이 없습니다 📝
          </div>
        </div>
      </div>
      <div class="post-list">
        <h4>북마크</h4>
        <div class="post-table bg-white p-3">
          <table
            class="table table-hover align-middle mb-0"
            th:if="${#lists.size(posts) > 0}"
          >
            <thead class="table-light">
              <tr>
                <th>내용</th>
                <th>작성일</th>
                <th>추천수</th>
              </tr>
            </thead>
            <tbody>
              <tr
                th:each="post : ${bookmarks}"
                class="bookmarkedPosts post-card"
                style="cursor: pointer"
                th:attr="data-id=${post.id}"
              >
                <td th:text="${post.content}">내용</td>
                <td
                  th:text="${#temporals.format(post.createdDate, 'yyyy-MM-dd')}"
                >
                  날짜
                </td>
                <td th:text="${post.recommendCount}">0</td>
              </tr>
            </tbody>
          </table>

          <!-- 글이 하나도 없을 때 -->
          <div class="no-posts" th:if="${#lists.size(posts) == 0}">
            아직 작성한 게시글이 없습니다 📝
          </div>
        </div>
      </div>
      <div class="products-grid">
        <h4>찜 리스트</h4>
        <div
          th:if="${#lists.isEmpty(products)}"
          class="no-products"
          style="grid-column: 1/-1"
        >
          등록된 상품이 없습니다.
        </div>

        <div th:each="p : ${products}">
          <a
            th:href="${p.linkUrl}"
            target="_blank"
            class="card product-card mb-0"
          >
            <div class="product-img-wrapper">
              <img th:src="${p.imageUrl}" alt="이미지" />
            </div>
            <div class="card-body">
              <div class="brand-name" th:text="${p.brandName}">브랜드</div>
              <div class="product-name" th:text="${p.productName}">상품명</div>
            </div>
          </a>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/modalLoader.js"></script>
    <script src="/js/profile.js"></script>
    <script src="/js/detail.js"></script>
    <script src="/js/chatfrag.js"></script>

    <div
      class="modal fade"
      id="detailModal"
      data-bs-keyboard="true"
      data-bs-backdrop="true"
      tabindex="-1"
      aria-hidden="true"
      role="dialog"
    >
      <div
        class="modal-dialog modal-dialog-centered modal-xl"
        role="document"
      ></div>
    </div>
  </body>
</html>
