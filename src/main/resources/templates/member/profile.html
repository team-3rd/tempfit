<!DOCTYPE html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <title th:text="${profile.nickname} + '님의 프로필 - TempFit'">
      프로필
    </title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <link th:href="@{/css/profile.css}" rel="stylesheet" />
    <link th:href="@{/css/detail.css}" rel="stylesheet" />
    <link th:href="@{/css/chatfrag.css}" rel="stylesheet" />
  </head>
  <body>
    <th:block th:replace="fragments/navbar :: navbar"></th:block>

    <button
      class="chat-btn shadow-sm"
      id="chat-btn"
      data-bs-toggle="offcanvas"
      data-bs-target="#offcanvasBottom"
      aria-controls="offcanvasBottom"
      sec:authorize="isAuthenticated()"
    >
      <span class="chatTitle">
        <i class="bi bi-chat-dots"></i>
      </span>
      <i class="chatToggle bi bi-chevron-double-up"></i>
    </button>
    <div
      class="offcanvas offcanvas-bottom shadow-sm"
      tabindex="-1"
      id="offcanvasBottom"
      data-bs-backdrop="false"
      data-bs-scroll="true"
      sec:authorize="isAuthenticated()"
    >
      <div class="offcanvas-body" id="offcanvas-body"></div>
    </div>

    <main class="profile-page container">
      <div class="profile-top">
        <!-- 프로필 이미지 + 업로드/삭제 -->
        <div
          class="profile-container"
          th:classappend="${isOwner} ? '' : 'pe-none'"
        >
          <!-- file input은 화면에는 숨김, 클릭 시 실행 (owner만 허용하려면 JS에서 확인) -->
          <div class="profile-image-wrapper">
            <img
              id="profileImg"
              class="profile-image"
              th:src="${profile != null && profile.profileImageUrl != null ? profile.profileImageUrl : '/images/default.png'}"
              alt="프로필 이미지"
            />
          </div>
        </div>

        <!-- 프로필 정보 -->
        <div class="profile-info ms-3">
          <h2 th:text="${profile.nickname}">닉네임</h2>
          <div class="text-muted" th:text="${profile.email}">이름</div>

          <div class="profile-stats">
            <div class="stat">
              팔로워:
              <strong id="followerCount" th:text="${followerCount}">0</strong>
            </div>
            <div class="stat">
              팔로잉:
              <strong id="followingCount" th:text="${followingCount}">0</strong>
            </div>
          </div>

          <div class="follow-buttons" sec:authorize="isAuthenticated()">
            <!-- 소유자면 프로필 수정 링크 -->
            <a
              th:if="${isOwner}"
              class="btn btn-outline-primary btn-sm"
              th:href="@{/member/mychange}"
              >프로필 수정</a
            >

            <!-- 다른 사용자일 때 팔로우/언팔로우 버튼 -->
            <div th:unless="${isOwner}">
              <form
                th:action="@{/follow/{id}(id=${profile.email})}"
                method="post"
              >
                <button
                  id="followBtn"
                  type="submit"
                  class="btn btn-primary btn-sm"
                  th:if="${!isFollowing}"
                >
                  팔로우
                </button>
              </form>
              <form
                th:action="@{/follow/{id}(id=${profile.email})}"
                method="post"
              >
                <button
                  id="unfollowBtn"
                  type="submit"
                  class="btn btn-secondary btn-sm"
                  th:if="${isFollowing}"
                >
                  언팔로우
                </button>
              </form>
            </div>
            <div class="mt-3">
              <form
                th:action="@{/messages/{id}(id=${profile.email})}"
                method="get"
              >
                <button
                  id="chatBtn"
                  type="submit"
                  class="btn btn-outline-primary btn-sm"
                >
                  채팅
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>

      <section class="mt-4">

  <!-- 탭 헤더 -->
<div class="profile-tabbar">
  <ul class="nav profile-tabs" id="profileTabs" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active" id="posts-tab"
              data-bs-toggle="tab" data-bs-target="#tab-posts"
              type="button" role="tab" aria-label="게시글">
        <i class="bi bi-grid-3x3-gap"></i>
        <span class="visually-hidden">게시글</span>
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="bookmarks-tab"
              data-bs-toggle="tab" data-bs-target="#tab-bookmarks"
              type="button" role="tab" aria-label="북마크">
        <i class="bi bi-bookmark"></i>
        <span class="visually-hidden">북마크</span>
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="dibs-tab"
              data-bs-toggle="tab" data-bs-target="#tab-dibs"
              type="button" role="tab" aria-label="찜 리스트">
        <i class="bi bi-bag"></i>
        <span class="visually-hidden">찜 리스트</span>
      </button>
    </li>
  </ul>
</div>

  <!-- 탭 내용 -->
  <div class="tab-content pt-3">
    <!-- 게시글 -->
     <div class="tab-pane fade show active" id="tab-posts" role="tabpanel" aria-labelledby="posts-tab">
      <div class="post-grid">
        <div th:each="post : ${posts}" class="post-card text-decoration-none text-reset" th:attr="data-id=${post.id}">
          <div class="card-top">
            <div class="left">
              <img class="profileImg" th:src="@{${post.profileImageUrl}}" alt="프로필" />
              <div class="name-time">
                <p class="nickname" th:text="${post.author.nickname}">닉네임</p>
                <p class="time" th:text="${post.displayDate}">1시간 전</p>
              </div>
            </div>
            <div class="weather">
              <i
                class="bi"
                th:classappend="
                   ${post.sky}=='맑음' ? ' bi-sun' :
                   (${post.sky}=='흐림' ? ' bi-cloud-sun' :
                   (${post.sky}=='구름 많음' ? ' bi-clouds' :
                   (${post.sky}=='비' ? ' bi-cloud-rain' :
                   (${post.sky}=='눈' ? ' bi-cloud-snow' : ''))))"
              >
              </i>
              <span class="temp" th:text="${post.maxTemp + '°'}"></span>
              <span class="temp" th:text="${post.minTemp + '°'}"></span>
            </div>
          </div>

          <!-- 이미지(정방형) + 여러장 인디케이터 -->
          <div class="image-wrap">
            <img
              th:if="${post.repImageUrl != null}"
              th:src="@{'/uploads/' + ${post.repImageUrl}}"
              alt="대표사진"
              class="card-img-top"
            />
            <i
              class="bi bi-stickies-fill multi-indicator"
              th:if="${post.extraImageUrls != null and #lists.size(post.extraImageUrls) > 0}"
            ></i>
          </div>

          <div class="card-body-ig">
            <div class="actions">
              <div class="left-actions">
                <div class="action-group">
                  <button type="button" class="btn-action btn-like" th:attr="data-id=${post.id}" title="좋아요">
                    <i class="bi" th:classappend="${post.likedByMe} ? ' bi-heart-fill' : ' bi-heart'"></i>
                  </button>
                  <span class="count like-count" th:attr="data-count=${post.recommendCount}">0</span>
                </div>
                <div class="action-group">
                  <button type="button" class="btn-action btn-comment" th:attr="data-id=${post.id}" title="댓글">
                    <i class="bi bi-chat"></i>
                  </button>
                  <span
                    class="ig-count"
                    id="igCommentCount"
                    th:attr="data-count=${post.commentCount}"
                    th:text="${post.commentCount}"
                    >0</span
                  >
                </div>
              </div>
              <div class="right-actions">
                <button type="button" class="btn-action btn-bookmark" th:attr="data-id=${post.id}" title="북마크">
                  <i class="bi" th:classappend="${post.bookmarkedByMe} ? ' bi-bookmark-fill' : ' bi-bookmark'"></i>
                </button>
              </div>
            </div>

            <div class="caption">
              <span class="name" th:text="${post.author.nickname}">닉네임</span>
              <span class="content" th:text="${post.content}">내용</span>
            </div>
          </div>
        </div>
        <div class="no-posts" th:if="${#lists.size(posts) == 0}">
            아직 작성한 게시글이 없습니다 📝
        </div>
      </div>
      </div>

    <!-- 북마크 -->
     <div class="tab-pane fade" id="tab-bookmarks" role="tabpanel" aria-labelledby="bookmarks-tab">
      <div class="post-grid">
      <div th:each="post : ${bookmarks}" class="post-card text-decoration-none text-reset" th:attr="data-id=${post.id}">
          <div class="card-top">
            <div class="left">
              <img class="profileImg" th:src="@{${post.profileImageUrl}}" alt="프로필" />
              <div class="name-time">
                <p class="nickname" th:text="${post.author.nickname}">닉네임</p>
                <p class="time" th:text="${post.displayDate}">1시간 전</p>
              </div>
            </div>
            <div class="weather">
              <i
                class="bi"
                th:classappend="
                   ${post.sky}=='맑음' ? ' bi-sun' :
                   (${post.sky}=='흐림' ? ' bi-cloud-sun' :
                   (${post.sky}=='구름 많음' ? ' bi-clouds' :
                   (${post.sky}=='비' ? ' bi-cloud-rain' :
                   (${post.sky}=='눈' ? ' bi-cloud-snow' : ''))))"
              >
              </i>
              <span class="temp" th:text="${post.maxTemp + '°'}"></span>
              <span class="temp" th:text="${post.minTemp + '°'}"></span>
            </div>
          </div>

          <!-- 이미지(정방형) + 여러장 인디케이터 -->
          <div class="image-wrap">
            <img
              th:if="${post.repImageUrl != null}"
              th:src="@{'/uploads/' + ${post.repImageUrl}}"
              alt="대표사진"
              class="card-img-top"
            />
            <i
              class="bi bi-stickies-fill multi-indicator"
              th:if="${post.extraImageUrls != null and #lists.size(post.extraImageUrls) > 0}"
            ></i>
          </div>

          <div class="card-body-ig">
            <div class="actions">
              <div class="left-actions">
                <div class="action-group">
                  <button type="button" class="btn-action btn-like" th:attr="data-id=${post.id}" title="좋아요">
                    <i class="bi" th:classappend="${post.likedByMe} ? ' bi-heart-fill' : ' bi-heart'"></i>
                  </button>
                  <span class="count like-count" th:attr="data-count=${post.recommendCount}">0</span>
                </div>
                <div class="action-group">
                  <button type="button" class="btn-action btn-comment" th:attr="data-id=${post.id}" title="댓글">
                    <i class="bi bi-chat"></i>
                  </button>
                  <span
                    class="ig-count"
                    id="igCommentCount"
                    th:attr="data-count=${post.commentCount}"
                    th:text="${post.commentCount}"
                    >0</span
                  >
                </div>
              </div>
              <div class="right-actions">
                <button type="button" class="btn-action btn-bookmark" th:attr="data-id=${post.id}" title="북마크">
                  <i class="bi" th:classappend="${post.bookmarkedByMe} ? ' bi-bookmark-fill' : ' bi-bookmark'"></i>
                </button>
              </div>
            </div>

            <div class="caption">
              <span class="name" th:text="${post.author.nickname}">닉네임</span>
              <span class="content" th:text="${post.content}">내용</span>
            </div>
          </div>
        </div>
        <div class="text-muted text-center py-5" th:if="${bookmarks == null || #lists.isEmpty(bookmarks)}">
          북마크한 글이 없습니다 ⭐
        </div>
      </div>
    </div>

    <!-- 찜 리스트 (상품 카드 그리드) -->
    <div class="tab-pane fade" id="tab-dibs" role="tabpanel" aria-labelledby="dibs-tab">
      <div class="products-grid">
        <div
          th:if="${#lists.isEmpty(products)}"
          class="no-products"
          style="grid-column: 1/-1"
        >
          등록된 상품이 없습니다.
        </div>

        <div th:each="p : ${products}" class="product-card-wrapper">
          <!-- 카드 전체는 상품 링크 -->
          <a
            th:href="${p.linkUrl != null && !#strings.isEmpty(p.linkUrl) ? p.linkUrl : '#'}"
            target="_blank"
            class="card product-card mb-0"
          >
            <div class="product-img-wrapper">
              <img th:src="${p.imageUrl}" alt="이미지" />
            </div>
            <div class="card-body">
              <div class="brand-name" th:text="${p.brandName}">브랜드</div>
              <div
                class="product-name text-truncate"
                th:text="${p.productName}"
              >
                상품명
              </div>
            </div>
          </a>
          <button
            type="button"
            class="dib-btn btn-action"
            th:attr="data-id=${p.id}"
            title="찜"
            aria-pressed="false"
          >
            <i class="bi bi-bag"></i>
          </button>
        </div>
      </div>
  </div>
</section>
    </main>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const initial = location.hash || '#tab-posts';
        const btn = document.querySelector(`[data-bs-target="${initial}"]`);
        if (btn) new bootstrap.Tab(btn).show();

        document.querySelectorAll('#profileTabs [data-bs-toggle="tab"]').forEach(b => {
          b.addEventListener('shown.bs.tab', e => {
            history.replaceState(null, '', e.target.getAttribute('data-bs-target'));
          });
        });
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/modalLoader.js"></script>
    <script src="/js/profile.js"></script>
    <script src="/js/detail.js"></script>
    <script src="/js/chatfrag.js"></script>

    <div
      class="modal fade"
      id="detailModal"
      data-bs-keyboard="true"
      data-bs-backdrop="true"
      tabindex="-1"
      aria-hidden="true"
      role="dialog"
    >
      <div
        class="modal-dialog modal-dialog-centered modal-xl"
        role="document"
      ></div>
    </div>
  </body>
</html>
