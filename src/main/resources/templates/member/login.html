<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
      crossorigin="anonymous"
    />
    <!-- <link href="/css/darkmode.css" rel="stylesheet" /> -->
    <link href="/css/login.css" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/pretendard@latest/dist/web/variable/pretendardvariable.css"
      rel="stylesheet"
    />
    <title>로그인 - 템핏 TempFit</title>
  </head>
  <body class="bg-light d-flex flex-column min-vh-100">
    <th:block th:replace="fragments/navbar :: navbar"></th:block>

    <!-- <th:block th:replace="fragments/toggle :: toggle"></th:block> -->

    <div
      class="container d-flex align-items-center justify-content-center min-vh-100 "
    >
      <div class="card shadow p-4" style="width: 100%; max-width: 400px; border-color: transparent;">
        <h2 class="text-center mb-4">로그인</h2>

        <form th:action="@{/member/login}" method="post">
          <div class="form-floating mb-3">
            <input
              type="text"
              class="form-control"
              id="id"
              name="username"
              placeholder=" "
              spellcheck="false"
              required
            />
            <label for="id">이메일 (ID)</label>
          </div>

          <div class="form-floating mb-3">
            <input
              type="password"
              class="form-control"
              id="InputPassword"
              name="password"
              placeholder=" "
              required
            />
            <label for="InputPassword">비밀번호</label>
          </div>

          <div class="form-check mb-3">
            <input
              type="checkbox"
              class="form-check-input"
              id="rememberMe"
              name="remember-me"
            />
            <label class="form-check-label" for="rememberMe">로그인 유지</label>
          </div>

          <button type="submit" class="btn btn-primary w-100 mb-2">
            로그인
          </button>
        </form>

        <div th:if="${param.error}" class="text-danger text-center mb-2">
          아이디나 비밀번호를 확인해 주세요
        </div>
        <span style="color: gray; text-align: center;">또는</span>
        <a
          href="/oauth2/authorization/google"
          class="btn btn-outline-danger w-100 mt-2 mb-2"
        >
          <i class="bi bi-google"></i> 구글 로그인
        </a>

        <div style="margin-top: 8px; border-top: 1px solid var(--bs-border-color);">
          <div class="text-center mt-2">
            <span style="color: gray; margin-right: 5px;">계정이 없으신가요?</span>
            <a href="/member/register" class="text-decoration-none">회원가입</a>
          </div>
        </div>
      </div>
    </div>
    <th:block th:replace="fragments/footer :: footer"></th:block>
    <!-- Bootstrap Icons (for Google logo if needed) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />
  </body>
</html>
