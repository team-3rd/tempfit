<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입 - 템핏 TempFit</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
      crossorigin="anonymous"
    />

    <!-- 다크모드 -->
    <link rel="stylesheet" href="/css/darkmode.css" />
  </head>
  <body>
    <!-- Navbar -->
    <th:block th:replace="fragments/navbar :: navbar"></th:block>

    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card shadow-lg p-4">
            <h3 class="card-title text-center mb-4">회원가입</h3>

            <form th:action="@{/member/register}" th:object="${dto}" method="post">
              <div class="form-floating mb-3">
                <input type="text" class="form-control" th:field="*{email}" id="email" placeholder="이메일" required />
                <label for="email">이메일 (ID)</label>
              </div>

              <div class="form-floating mb-3">
                <input type="password" class="form-control" th:field="*{password}" id="password" placeholder="비밀번호" required />
                <label for="password">비밀번호</label>
              </div>

              <div class="form-floating mb-3">
                <input type="text" class="form-control" th:field="*{name}" id="name" placeholder="이름" required />
                <label for="name">이름</label>
              </div>

              <div class="form-floating mb-3">
                <input type="text" class="form-control" th:field="*{nickname}" id="nickname" placeholder="닉네임" required />
                <label for="nickname">닉네임</label>
              </div>

              <div class="mb-3">
                <label class="form-label d-block">성별</label>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" th:field="*{sex}" value="MALE" id="male" />
                  <label class="form-check-label" for="male">남성</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" th:field="*{sex}" value="FEMALE" id="female" />
                  <label class="form-check-label" for="female">여성</label>
                </div>
              </div>

              <button type="submit" class="btn btn-primary w-100">회원가입</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS (Optional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
