<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
  />
    <!-- <link href="/css/darkmode.css" rel="stylesheet" /> -->
    <link href="/css/login.css" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/pretendard@latest/dist/web/variable/pretendardvariable.css"
      rel="stylesheet"
    />
    <title>회원가입 - 템핏 TempFit</title>
  </head>
  <body class="d-flex flex-column min-vh-100">
    <!-- Navbar -->
    <th:block th:replace="fragments/navbar :: navbar"></th:block>

    <!-- <th:block th:replace="fragments/toggle :: toggle"></th:block> -->

    <div class="container py-5 flex-grow-1">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card shadow-lg p-4" style="border-color: transparent;">
            <h3 class="card-title text-center mb-4">회원가입</h3>

            <form
              th:action="@{/member/register}"
              th:object="${dto}"
              method="post"
            >
              <div class="form-floating mb-3">
                <input
                  type="text"
                  class="form-control"
                  th:field="*{email}"
                  id="email"
                  placeholder="이메일"
                  spellcheck="false"
                  required
                />
                <label for="email">이메일 (ID)</label>
              </div>

              <div class="form-floating mb-3">
                <input
                  type="password"
                  class="form-control"
                  th:field="*{password}"
                  id="password"
                  placeholder="비밀번호"
                  required
                />
                <label for="password">비밀번호</label>
              </div>

              <div class="form-floating mb-3">
                <input
                  type="text"
                  class="form-control"
                  th:field="*{name}"
                  id="name"
                  placeholder="이름"
                  required
                />
                <label for="name">이름</label>
              </div>

              <div class="form-floating mb-3">
                <input
                  type="text"
                  class="form-control"
                  th:field="*{nickname}"
                  id="nickname"
                  placeholder="닉네임"
                  required
                />
                <label for="nickname">닉네임</label>
              </div>

              <div class="mb-3">
                <label class="form-label d-block">성별</label>
                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="radio"
                    th:field="*{sex}"
                    value="MALE"
                    id="male"
                  />
                  <label class="form-check-label" for="male">남성</label>
                </div>
                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="radio"
                    th:field="*{sex}"
                    value="FEMALE"
                    id="female"
                  />
                  <label class="form-check-label" for="female">여성</label>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label d-block">퍼스널 컬러</label>
                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="radio"
                    th:field="*{personalColorCode}"
                    value=1
                    id="springwarm"
                  />
                  <label class="form-check-label" for="springwarm">봄 웜톤</label>
                </div>
                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="radio"
                    th:field="*{personalColorCode}"
                    value=2
                    id="summercool"
                  />
                  <label class="form-check-label" for="summercool">여름 쿨톤</label>
                </div>
                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="radio"
                    th:field="*{personalColorCode}"
                    value=3
                    id="fallwarm"
                  />
                  <label class="form-check-label" for="fallwarm">가을 웜톤</label>
                </div>
                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="radio"
                    th:field="*{personalColorCode}"
                    value=4
                    id="wintercool"
                  />
                  <label class="form-check-label" for="wintercool">겨울 쿨톤</label>
                </div>
                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="radio"
                    th:field="*{personalColorCode}"
                    value=0
                    id="unknown"
                  />
                  <label class="form-check-label" for="unknown">미선택</label>
                </div>
              </div>

              <button type="submit" class="btn btn-primary w-100 mb-2">
                회원가입
              </button>
            </form>
            <span style="color: gray; text-align: center;">또는</span>
              <a
                href="/oauth2/authorization/google"
                class="btn btn-outline-danger w-100 mt-2 mb-2"
              >
              <i class="bi bi-google"></i> 구글 로그인
              </a>
          </div>
        </div>
      </div>
    </div>
    <th:block th:replace="fragments/footer :: footer"></th:block>
    <!-- Bootstrap JS (Optional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
