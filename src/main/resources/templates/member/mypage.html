<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>템핏 TempFit - 마이페이지</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous" />
    
    <link href="/css/darkmode.css" rel="stylesheet" />
      <link href="/css/login.css" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/pretendard@latest/dist/web/variable/pretendardvariable.css"
      rel="stylesheet"
    />
    <style>
      .profile-card {
        max-width: 600px;
        margin: 3rem auto;
        padding: 2rem;
        box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.15);
        border-radius: 0.5rem;
      }
      .profile-item {
        font-size: 1.1rem;
        margin-bottom: 1rem;
      }
      .profile-label {
        font-weight: 600;
        color: #555;
      }
    </style>
  </head>
  <body class="d-flex flex-column min-vh-100">
    <!-- Navbar -->
    <th:block th:replace="fragments/navbar :: navbar"></th:block>
    
    <th:block th:replace="fragments/toggle :: toggle"></th:block>

    <main class="container flex-grow-1">
      <div class="profile-card">
        <h2 class="mb-4 text-center">마이페이지</h2>

        <div class="profile-item">
          <span class="profile-label">이메일 (ID):</span> <span th:text="${dto.email}">user@example.com</span>
        </div>
        <div class="profile-item">
          <span class="profile-label">이름:</span> <span th:text="${dto.name}">홍길동</span>
        </div>
        <div class="profile-item">
          <span class="profile-label">별명:</span> <span th:text="${dto.nickname}">닉네임</span>
        </div>
        <div class="profile-item">
          <span class="profile-label">성별:</span>
          <span th:if="${dto.sex.name() == 'MALE'}">남성</span>
          <span th:if="${dto.sex.name() == 'FEMALE'}">여성</span>
        </div>
        <ul>
    <li>
      <a href="/mypage/posts">
        내가 쓴 글 ([[dto.postCount]] 건)
      </a>
    </li>
    <li>
      <a href="/mypage/comments">
        내가 쓴 댓글 ([[dto.commentCount]] 건)
      </a>
    </li>
  </ul>
        <div class="text-center mt-4">
          <a th:href="@{/member/mychange}" class="btn btn-primary px-5">정보 수정</a>
        </div>
      </div>
    </main>
    <th:block th:replace="fragments/footer :: footer"></th:block>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
