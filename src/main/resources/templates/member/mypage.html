<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>템핏 TempFit - 마이페이지</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous" />
    
    <link href="/css/darkmode.css" rel="stylesheet" />
      <link href="/css/login.css" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/pretendard@latest/dist/web/variable/pretendardvariable.css"
      rel="stylesheet"
    />
    <style>
      .profile-card {
        max-width: 600px;
        margin: 3rem auto;
        padding: 2rem;
        box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.15);
        border-radius: 0.5rem;
      }
      .profile-item {
        font-size: 1.1rem;
        margin-bottom: 1rem;
      }
      .profile-container {
            position: relative;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
            margin: 0 auto 1.5rem;
        }
      .profile-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
      .profile-label {
        font-weight: 600;
        color: #555;
      }
    </style>
  </head>
  <body class="d-flex flex-column min-vh-100">
    <!-- Navbar -->
    <th:block th:replace="fragments/navbar :: navbar"></th:block>
    
    <th:block th:replace="fragments/toggle :: toggle"></th:block>

    <main class="container flex-grow-1">
      <div class="profile-card">
        <h2 class="mb-4 text-center">마이페이지</h2>
        <div class="profile-container">
          <img th:src="@{${dto.profileImageUrl}}" class="profile-image" />
        </div>
        <div class="follow-container text-center my-3">
    <!-- 현재 사용자가 보고 있는 프로필 주인과 같지 않을 때만 버튼 표시 -->
    <div th:if="${#authentication.name != dto.email}">
        <!-- 팔로우 상태에 따라 다른 버튼 표시 -->
        <button id="followBtn" 
                class="btn btn-primary"
                th:data-email="${dto.email}"
                th:if="${!isFollowing}">
            팔로우
        </button>
        <button id="unfollowBtn" 
                class="btn btn-secondary"
                th:data-email="${dto.email}"
                th:if="${isFollowing}">
            언팔로우
        </button>
    </div>
</div>
        <div class="profile-item">
          <span class="profile-label">이메일 (ID):</span> <span th:text="${dto.email}">user@example.com</span>
        </div>
        <div class="profile-item">
          <span class="profile-label">이름:</span> <span th:text="${dto.name}">홍길동</span>
        </div>
        <div class="profile-item">
          <span class="profile-label">별명:</span> <span th:text="${dto.nickname}">닉네임</span>
        </div>
        <div class="profile-item">
          <span class="profile-label">성별:</span>
          <span th:if="${dto.sex != null and dto.sex.name() == 'MALE'}">남성</span>
          <span th:if="${dto.sex != null and dto.sex.name() == 'FEMALE'}">여성</span>
          <span th:if="${dto.sex == null}">미지정</span>
        </div>
        <ul>
    <li>
      <a th:href="@{/member/mypage/posts}">
        내가 쓴 글 ([[${dto.postCount}]] 건)
      </a>
    </li><!--
    <li>
      <a href="/mypage/comments">
        내가 쓴 댓글 ([[dto.commentCount]] 건)
      </a>
    </li>-->
  </ul>
        <div class="text-center mt-4">
          <a th:href="@{/member/mychange}" class="btn btn-primary px-5">정보 수정</a>
        </div>
      </div>
    </main>
    <th:block th:replace="fragments/footer :: footer"></th:block>
    <script>
      document.addEventListener("DOMContentLoaded", function() {
    const followBtn = document.getElementById("followBtn");
    const unfollowBtn = document.getElementById("unfollowBtn");

    if (followBtn) {
        followBtn.addEventListener("click", function() {
            const email = this.dataset.email;
            fetch(`/follow/${email}`, {
                method: "POST"
            }).then(res => {
                if (res.ok) {
                    location.reload();
                }
            });
        });
    }

    if (unfollowBtn) {
        unfollowBtn.addEventListener("click", function() {
            const email = this.dataset.email;
            fetch(`/follow/${email}`, {
                method: "DELETE"
            }).then(res => {
                if (res.ok) {
                    location.reload();
                }
            });
        });
    }
});
</script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
