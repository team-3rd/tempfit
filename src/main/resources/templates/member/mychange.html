<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>템핏 TempFit - 개인정보 수정</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous" />
      <link href="/css/darkmode.css" rel="stylesheet" />
      <link href="/css/login.css" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/pretendard@latest/dist/web/variable/pretendardvariable.css"
      rel="stylesheet"
    />
    <style>
      .edit-profile-container {
        max-width: 600px;
        margin: 3rem auto;
        padding: 2.5rem;
        box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.1);
        border-radius: 0.6rem;
        background-color: #fff;
      }
      [data-bs-theme="dark"] .edit-profile-container {
        max-width: 600px;
        margin: 3rem auto;
        padding: 2.5rem;
        box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.1);
        border-radius: 0.6rem;
        background-color: #1e1e1e;
      }
      h3 {
        font-weight: 600;
        margin-bottom: 1rem;
      }
      .form-label {
        font-weight: 500;
      }
      .btn-submit {
        width: 100%;
        padding: 0.75rem;
        font-size: 1.1rem;
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <th:block th:replace="fragments/navbar :: navbar"></th:block>
    
    <th:block th:replace="fragments/toggle :: toggle"></th:block>
    <main class="edit-profile-container">
      <h2 class="text-center mb-4">개인정보 수정</h2>
      <form th:action="@{/member/mychange}" th:object="${dto}" method="post" novalidate>
        
        <div class="mb-3">
          <label for="id" class="form-label">이메일 (ID)</label>
          <input type="text" class="form-control" id="id" name="email" placeholder="이메일 (ID)" th:field="*{email}" readonly required />
        </div>

        <div class="mb-3">
          <label for="name" class="form-label">이름</label>
          <input type="text" class="form-control" id="name" name="name" placeholder="이름" th:field="*{name}" th:attr="readonly=${#authentication.principal.fromSocial}" required />
        </div>

        <div class="mb-3">
          <label for="nickname" class="form-label">별명</label>
          <input type="text" class="form-control" id="nickname" name="nickname" placeholder="별명" th:field="*{nickname}" required />
        </div>

        <fieldset class="mb-4">
          <legend class="form-label">성별</legend>

          <div th:if="${#authentication.principal.fromSocial}">
            <div class="form-check">
              <input type="radio" class="form-check-input" name="sex" id="male" value="MALE" th:checked="${dto.sex.name() == 'MALE'}" disabled />
              <label class="form-check-label" for="male">남성</label>
            </div>
            <div class="form-check">
              <input type="radio" class="form-check-input" name="sex" id="female" value="FEMALE" th:checked="${dto.sex.name() == 'FEMALE'}" disabled />
              <label class="form-check-label" for="female">여성</label>
            </div>
            <input type="hidden" th:field="*{sex}" />
          </div>

          <div th:unless="${#authentication.principal.fromSocial}">
            <div class="form-check">
              <input type="radio" class="form-check-input" th:field="*{sex}" id="male" value="MALE" />
              <label class="form-check-label" for="male">남성</label>
            </div>
            <div class="form-check">
              <input type="radio" class="form-check-input" th:field="*{sex}" id="female" value="FEMALE" />
              <label class="form-check-label" for="female">여성</label>
            </div>
          </div>
        </fieldset>

        <button type="submit" class="btn btn-primary btn-submit">개인정보 변경</button>
      </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
