<!-- templates/community/detail.html -->
<div th:fragment="detailCard" class="ig-modal modal-content">
  <div class="ig-wrap">
    <!-- 왼쪽 미디어 영역 -->
    <div class="ig-media">
      <div id="igCarousel" class="carousel slide" data-bs-ride="false">
        <div class="carousel-inner">
          <!-- 대표 이미지 -->
          <div class="carousel-item active" th:if="${post.repImageUrl != null}">
            <img
              class="ig-photo"
              th:src="@{'/uploads/' + ${post.repImageUrl}}"
              alt="image"
            />
          </div>
          <!-- 추가 이미지 -->
          <div th:if="${post.extraImageUrls != null}">
            <div class="carousel-item" th:each="url : ${post.extraImageUrls}">
              <img
                class="ig-photo"
                th:src="@{'/uploads/' + ${url}}"
                alt="image"
              />
            </div>
          </div>
        </div>
      </div>
      <button
        class="carousel-control-prev"
        id="carousel-prev-btn"
        type="button"
        data-bs-target="#igCarousel"
        data-bs-slide="prev"
      >
        <span
          class="carousel-control-prev-icon"
          id="carousel-prev"
          aria-hidden="true"
        ></span>
        <!-- <span class="visually-hidden">Prev</span> -->
      </button>
      <button
        class="carousel-control-next"
        id="carousel-next-btn"
        type="button"
        data-bs-target="#igCarousel"
        data-bs-slide="next"
      >
        <span
          class="carousel-control-next-icon"
          id="carousel-next"
          aria-hidden="true"
        ></span>
        <!-- <span class="visually-hidden">Next</span> -->
      </button>

      <!-- (작성자 전용) 삭제 버튼: 사진 우측 하단 -->
      <form
        class="ig-del-form"
        th:if="${#authentication.name} == ${post.author.email}"
        th:action="@{/community/delete/{id}(id=${post.id})}"
        method="post"
        onsubmit="return confirm('정말 삭제하시겠습니까?');"
      >
        <input type="hidden" name="_method" value="delete" />
        <button type="submit" class="ig-del-btn" title="삭제">
          <i class="bi bi-trash"></i>
        </button>
      </form>
    </div>

    <!-- 오른쪽 사이드 -->
    <div class="ig-side">
      <!-- 헤더 -->
      <div class="ig-header">
        <img
          class="ig-avatar"
          th:src="@{${post.profileImageUrl}}"
          alt="프로필"
        />
        <div class="ig-user">
          <a
            class="ig-name"
            th:href="@{/member/{email}(email=${post.author.email})}"
            target="_blank"
            th:text="${post.author.nickname}"
            >닉네임</a
          >
        </div>

        <!-- 우측 상단: 날씨/온도 -->
        <div class="ig-weather ms-auto">
          <i
            class="bi"
            th:classappend="
               ${post.sky}=='맑음' ? ' bi-sun' :
               (${post.sky}=='흐림' ? ' bi-cloud-sun' :
               (${post.sky}=='구름 많음' ? ' bi-clouds' :
               (${post.sky}=='비' ? ' bi-cloud-rain' :
               (${post.sky}=='눈' ? ' bi-cloud-snow' : ''))))"
          >
          </i>
          <span class="temp" th:text="${post.maxTemp + '°'}"></span>
          <span class="temp" th:text="${post.minTemp + '°'}"></span>
        </div>
      </div>

      <!-- 본문 + 댓글 스크롤 영역 -->
      <div class="ig-body" id="igBody">
        <!-- 캡션(본문) -->
        <div
          class="ig-caption"
          th:if="${post.content != null and post.content.trim().length() > 0}"
        >
          <img
            class="ig-avatar"
            th:src="@{${post.profileImageUrl}}"
            alt="프로필"
          />
          <div>
            <a
              class="ig-name"
              th:href="@{/member/{email}(email=${post.author.email})}"
              target="_blank"
              th:text="${post.author.nickname}"
              >닉네임</a
            >
            <span class="ig-text" th:text="${post.content}">내용</span>
            <div class="ig-time" th:text="${post.displayDate}">1시간 전</div>
          </div>
        </div>

        <!-- 댓글 목록 -->
        <ul class="ig-comments" id="igComments">
          <li class="ig-comment" th:each="c : ${comments}">
            <img
              class="ig-c-avatar"
              th:src="@{${c.author.profileImageUrl}}"
              alt="프로필"
            />
            <div class="ig-c-wrap">
              <span
                class="ig-c-name"
                th:text="${c.author != null && c.author.nickname != null && c.author.nickname.trim().length()>0 ? c.author.nickname : '익명'}"
                >익명</span
              >
              <span class="ig-c-text" th:text="${c.content}">댓글내용</span>
              <time
                class="ig-c-time js-rel"
                th:attr="data-time=${#temporals.format(c.createdDate,'yyyy-MM-dd''T''HH:mm:ss')}"
              >
                1시간 전
              </time>
            </div>
          </li>
        </ul>
      </div>

      <!-- 액션바 -->
      <div class="ig-actions">
        <div class="left">
          <!-- 초기 상태: likedByMe → 빨간 하트 -->
          <button
            type="button"
            class="icon-btn btn-like"
            th:attr="data-id=${post.id}"
            title="좋아요"
          >
            <i
              class="bi"
              th:classappend="${post.likedByMe} ? ' bi-heart-fill' : ' bi-heart'"
            ></i>
          </button>
          <span
            class="ig-count"
            id="igLikeCount"
            th:attr="data-count=${post.recommendCount}"
            th:text="${post.recommendCount}"
            >0</span
          >

          <button type="button" class="icon-btn btn-chat" title="댓글">
            <i class="bi bi-chat"></i>
          </button>
          <span
            class="ig-count"
            id="igCommentCount"
            th:attr="data-count=${post.commentCount}"
            th:text="${post.commentCount}"
            >0</span
          >
        </div>

        <div class="right">
          <!-- 초기 상태: bookmarkedByMe → 파란 책갈피 -->
          <button
            type="button"
            class="icon-btn btn-bookmark"
            th:attr="data-id=${post.id}"
            title="북마크"
          >
            <i
              class="bi"
              th:classappend="${post.bookmarkedByMe} ? ' bi-bookmark-fill' : ' bi-bookmark'"
            ></i>
          </button>
        </div>
      </div>

      <div class="ig-time times" th:text="${post.displayDate}">1시간 전</div>

      <!-- 댓글 입력 -->
      <div class="ig-input" sec:authorize="isAuthenticated()">
        <form
          class="ig-form"
          th:action="@{/api/community/detail/{id}/comments(id=${post.id})}"
          method="post"
          th:attr="data-id=${post.id}"
        >
          <textarea
            class="ig-textarea"
            name="content"
            placeholder="댓글 쓰기"
            required
          ></textarea>
          <button type="submit" class="ig-submit">게시</button>
        </form>
      </div>

      <div
        class="ig-login-hint text-center text-muted"
        sec:authorize="!isAuthenticated()"
      >
        댓글을 작성하려면 <a th:href="@{/member/login}">로그인</a>이 필요합니다.
      </div>
    </div>
  </div>
</div>
