<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="UTF-8" />
    <title>게시글 상세</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/detail.css" />
    <style>
      .view-icon {
        width: 1.2em;
        height: 1.2em;
        vertical-align: middle;
        margin-bottom: 2px;
        margin-left: 4px;
        margin-right: 2px;
      }
      .recommend-icon {
        color: #e94e77;
        margin-right: 2px;
        font-size: 1.1em;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <div th:replace="fragments/navbar :: navbar"></div>
    <div class="container detail-container">
      <!-- 제목 -->
      <div class="detail-title" th:text="${post.title}">게시글 제목</div>

      <!-- 작성자, 날짜, 추천 수, 조회수 -->
      <div class="detail-meta">
        작성자: <span th:text="${post.author.nickname}">관리자</span>
        &nbsp;|&nbsp; 등록일:
        <span th:text="${#temporals.format(post.createdDate, 'yyyy-MM-dd HH:mm')}">
          2025-06-15 12:00
        </span>
        &nbsp;|&nbsp;
        <span>
          <span class="recommend-icon">♥</span>
          <span th:text="${post.recommendCount}">0</span>
        </span>
        &nbsp;|&nbsp;
        <span>
          <!-- 눈 SVG 아이콘 -->
          <svg class="view-icon" fill="currentColor" viewBox="0 0 16 16">
            <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288C13.881 11.332 12.12 12.5 10 12.5c-2.12 0-3.88-1.168-5.168-2.457A13.133 13.133 0 0 1 1.172 8z"/>
            <path d="M8 5a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm0 1a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/>
          </svg>
          <span th:text="${post.viewCount}">0</span>
        </span>
      </div>

      <!-- 스타일 배지 -->
      <div class="badge-list mb-3">
        <span th:if="${post.male&&!post.female}" class="badge bg-primary">남성</span>
        <span th:if="${post.female&&!post.male}" class="badge bg-danger">여성</span>
        <span th:if="${post.male&&post.female}" class="badge bg-success">공용</span>
        <span th:if="${post.casual}" class="badge bg-secondary">캐주얼</span>
        <span th:if="${post.street}" class="badge bg-secondary">스트리트</span>
        <span th:if="${post.formal}" class="badge bg-secondary">포멀</span>
        <span th:if="${post.outdoor}" class="badge bg-secondary">아웃도어</span>
        <span class="badge bg-day day" th:text="${'최고  ' + post.maxTemp + '℃'}"></span>
        <span class="badge bg-night night" th:text="${'최저  ' + post.minTemp + '℃'}"></span>
      </div>

      <!-- 대표 이미지 -->
      <div th:if="${post.repImageUrl != null}" class="mb-3">
        <img
          th:src="@{'/uploads/' + ${post.repImageUrl}}"
          alt="대표사진"
          class="detail-image"
        />
      </div>

      <!-- 추가 이미지들 -->
      <div th:if="${post.extraImageUrls != null}" class="mb-3">
        <div th:each="url : ${post.extraImageUrls}" class="mb-3">
          <img
            th:src="@{'/uploads/' + ${url}}"
            alt="추가사진"
            class="detail-image"
          />
        </div>
      </div>

      <!-- 본문 내용 -->
      <div class="detail-content" th:text="${post.content}">게시글 내용</div>

      <!-- 액션 버튼 -->
      <div class="detail-actions">
        <a th:href="@{/community/list}" class="btn btn-outline-secondary">목록</a>
        <form
          th:action="@{/community/recommend/{id}(id=${post.id})}"
          method="post"
          class="d-inline"
        >
          <button type="submit" class="btn btn-outline-primary">추천</button>
        </form>
        <a
          th:href="@{/community/edit/{id}(id=${post.id})}"
          class="btn btn-primary"
          th:if="${#authentication.name} == ${post.author.email}"
          >수정</a
        >
        <form
          th:action="@{/community/delete/{id}(id=${post.id})}"
          method="post"
          th:if="${#authentication.name} == ${post.author.email}"
          onsubmit="return confirm('정말 삭제하시겠습니까?');"
          class="d-inline"
        >
          <input type="hidden" name="_method" value="delete" />
          <button type="submit" class="btn btn-danger">삭제</button>
        </form>
      </div>

      <!-- 댓글 작성 (로그인한 사용자만) -->
      <div sec:authorize="isAuthenticated()">
        <form
          th:action="@{/community/detail/{id}/comments(id=${post.id})}"
          method="post"
          class="mt-3 mb-4"
        >
          <div class="mb-2">
            <textarea
              name="content"
              class="form-control"
              rows="3"
              placeholder="댓글을 입력하세요"
              required
            ></textarea>
          </div>
          <button type="submit" class="btn btn-sm btn-primary">
            댓글 등록
          </button>
        </form>
      </div>

      <!-- 비로그인 시 안내 및 로그인 페이지로 이동 -->
      <div sec:authorize="!isAuthenticated()" class="mt-3 mb-4 text-center">
        <p class="text-muted">
          댓글을 작성하려면
          <a th:href="@{/member/login}">로그인</a>이 필요합니다.
        </p>
      </div>

      <!-- 댓글 목록 -->
      <div>
        <h5>댓글</h5>
        <div th:each="c : ${comments}" class="mb-3">
          <small
            class="text-muted"
            th:text="${c.author != null && c.author.nickname.trim().length()>0
                         ? c.author.nickname : '익명'}"
            >익명</small
          >
          &nbsp;
          <small
            th:text="${#temporals.format(c.createdDate,'yyyy-MM-dd HH:mm')}"
          >
            시간
          </small>
          <p th:text="${c.content}">댓글 내용</p>
        </div>
      </div>
    </div>
    <div th:replace="fragments/footer :: footer"></div>
  </body>
</html>
