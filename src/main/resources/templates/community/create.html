<!DOCTYPE html>
<html lang="ko" xmlns="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>글쓰기 - TempFit</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- 아이콘 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/create.css" />
  </head>
  <body>
    <div th:replace="fragments/navbar :: navbar"></div>

    <!-- 경고 팝업 -->
    <div
      id="warningPopup"
      class="alert alert-warning alert-dismissible fade show text-center"
      role="alert"
    >
      한 게시글에 하나의 룩만 올려주세요!<br />
      <span class="text-danger"
        >※다른 룩을 같이 올리실 경우 제재될 수 있습니다.※</span
      >
      <button
        type="button"
        class="btn-close"
        data-bs-dismiss="alert"
        aria-label="Close"
      ></button>
    </div>

    <div class="container px-4 px-lg-5 mt-4">
      <!-- 폼: 좌우 2열 전체를 감쌈 -->
      <form
        id="communityForm"
        th:action="@{/community/register}"
        method="post"
        enctype="multipart/form-data"
        class="needs-validation"
        novalidate
      >
        <div class="row g-4">
          <!-- 왼쪽: 큰 미디어 + 썸네일 + 파일 선택 -->
          <div class="col-12 col-lg-7 imgCard">
            <div class="card media-panel shadow-sm p-3">
              <!-- 큰 미디어: 부트스트랩 캐러셀 -->
              <div
                id="createCarousel"
                class="carousel slide"
                data-bs-ride="false"
              >
                <div class="carousel-inner media-stage" id="carouselInner">
                  <div id="carouselEmpty" class="stage-empty">
                    이미지를 업로드하면 여기에서 미리볼 수 있어요
                  </div>
                </div>
                <button
                  class="carousel-control-prev media-control"
                  type="button"
                  id="carouselPrev"
                  data-bs-target="#createCarousel"
                  data-bs-slide="prev"
                >
                  <span
                    class="carousel-control-prev-icon"
                    aria-hidden="true"
                  ></span>
                </button>
                <button
                  class="carousel-control-next media-control"
                  type="button"
                  id="carouselNext"
                  data-bs-target="#createCarousel"
                  data-bs-slide="next"
                >
                  <span
                    class="carousel-control-next-icon"
                    aria-hidden="true"
                  ></span>
                </button>
              </div>

              <!-- 썸네일 스트립 (업로드 타일 + 대표/드래그 정렬/개별 삭제) -->
              <div
                id="previewContainer"
                class="thumb-strip d-flex flex-wrap gap-2 mt-3"
              ></div>

              <!-- 파일 인풋: 화면에서는 숨김(타일 클릭으로 열림) -->
              <div class="mt-3">
                <input
                  class="visually-hidden"
                  type="file"
                  id="imageFiles"
                  name="imageFiles"
                  accept="image/*"
                  multiple
                  required
                />
                <div class="form-text">대표 사진은 맨 앞에 배치해 주세요.</div>
                <div class="invalid-feedback">
                  최소 1장 이상의 사진을 올려주세요.
                </div>
              </div>
            </div>
          </div>

          <!-- 오른쪽: 작성자+날짜 / 내용 / 버튼들 -->
          <div class="col-12 col-lg-5">
            <div class="card shadow-sm p-3 right-card">
              <h2 class="page-title">글쓰기</h2>

              <!-- 작성자 + 날짜 나란히 -->
              <div class="row g-2 align-items-end mb-3">
                <div class="col">
                  <label for="author" class="form-label">작성자</label>
                  <input
                    type="text"
                    class="form-control"
                    id="author"
                    name="author"
                    th:value="${#authentication.principal.nickname}"
                    readonly
                  />
                </div>
                <div class="col-auto">
                  <label for="dates" class="form-label">날짜</label>
                  <input
                    type="date"
                    id="dates"
                    name="dates"
                    class="form-control"
                    required
                  />
                </div>
              </div>

              <!-- 내용 -->
              <div class="mb-3">
                <label for="content" class="form-label">내용</label>
                <textarea
                  class="form-control"
                  id="content"
                  name="content"
                  rows="10"
                  placeholder="내용을 입력하세요"
                ></textarea>
              </div>

              <!-- 숨김 필드들 -->
              <input type="hidden" name="repImageIndex" id="repImageIndex" />
              <input type="hidden" name="lat" id="lat" />
              <input type="hidden" name="lon" id="lon" />

              <!-- 버튼 -->
              <div class="d-flex justify-content-end">
                <button type="submit" class="btn btn-primary" id="bsubmitBtn">
                  등록
                </button>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>

    <div th:replace="fragments/footer :: footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/create.js"></script>
  </body>
</html>
