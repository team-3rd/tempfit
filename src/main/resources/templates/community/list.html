<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>게시글 - TempFit</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <link
      href="https://cdn.jsdelivr.net/npm/pretendard@latest/dist/web/variable/pretendardvariable.css"
      rel="stylesheet"
    />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <link rel="stylesheet" href="/css/list.css" />
    <link rel="stylesheet" href="/css/detail.css" />
    <link rel="stylesheet" href="/css/chatfrag.css" />

    <link
      href="https://cdn.jsdelivr.net/npm/pretendard@latest/dist/web/variable/pretendardvariable.css"
      rel="stylesheet"
    />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <div th:replace="fragments/navbar :: navbar"></div>
    <th:block th:replace="fragments/toggle :: toggle"></th:block>

    <button
      class="chat-btn shadow-sm"
      id="chat-btn"
      data-bs-toggle="offcanvas"
      data-bs-target="#offcanvasBottom"
      aria-controls="offcanvasBottom"
      sec:authorize="isAuthenticated()"
    >
      <span class="chatTitle">
        <i class="bi bi-chat-dots"></i>
      </span>
      <i class="chatToggle bi bi-chevron-double-up"></i>
    </button>
    <div
      class="offcanvas offcanvas-bottom shadow-sm"
      tabindex="-1"
      id="offcanvasBottom"
      data-bs-backdrop="false"
      data-bs-scroll="true"
      sec:authorize="isAuthenticated()"
    >
      <div class="offcanvas-body" id="offcanvas-body"></div>
    </div>

    <div class="container px-4 px-lg-5 mt-5 flex-grow-1">
      <div class="d-flex justify-content-between align-items-start mb-3 w-100">
        <form
          class="search-form d-flex flex-column"
          th:action="@{/community/list}"
          method="get"
          style="gap: 8px; max-width: 600px; width: 100%"
        >
          <!-- <div class="d-flex" style="gap: 8px">
            <select name="type" class="form-select form-select-sm">
              <option value="">전체</option>
              <option value="t" th:selected="${type=='t'}">제목</option>
              <option value="a" th:selected="${type=='a'}">작성자</option>
            </select>
            <input
              type="text"
              name="keyword"
              th:value="${keyword}"
              class="form-control form-control-sm"
              placeholder="검색어"
            />
            <button type="submit" class="btn btn-outline-secondary btn-sm">검색</button>
            <a th:href="@{/community/list}" class="btn btn-outline-secondary btn-sm reset-btn">초기화</a>
          </div> -->
        </form>
        <!-- <a
          th:href="@{/community/create}"
          class="btn btn-primary btn-sm ms-3 create-btn"
          sec:authorize="isAuthenticated()"
          ><i class="bi bi-pencil-square fs-5"></i></a
        > -->
      </div>

      <div class="post-grid">
        <div th:each="post : ${list}" class="post-card text-decoration-none text-reset" th:attr="data-id=${post.id}">
          <div class="card-top">
            <div class="left">
              <img class="profileImg" th:src="@{${post.profileImageUrl}}" alt="프로필" />
              <div class="name-time">
                <p class="nickname" th:text="${post.author.nickname}">닉네임</p>
                <p class="time" th:text="${post.displayDate}">1시간 전</p>
              </div>
            </div>
            <div class="weather">
              <i
                class="bi"
                th:classappend="
                   ${post.sky}=='맑음' ? ' bi-sun' :
                   (${post.sky}=='흐림' ? ' bi-cloud-sun' :
                   (${post.sky}=='구름 많음' ? ' bi-clouds' :
                   (${post.sky}=='비' ? ' bi-cloud-rain' :
                   (${post.sky}=='눈' ? ' bi-cloud-snow' : ''))))"
              >
              </i>
              <span class="temp" th:text="${post.maxTemp + '°'}"></span>
              <span class="temp" th:text="${post.minTemp + '°'}"></span>
            </div>
          </div>

          <!-- 이미지(정방형) + 여러장 인디케이터 -->
          <div class="image-wrap">
            <img
              th:if="${post.repImageUrl != null}"
              th:src="@{'/uploads/' + ${post.repImageUrl}}"
              alt="대표사진"
              class="card-img-top"
            />
            <i
              class="bi bi-stickies-fill multi-indicator"
              th:if="${post.extraImageUrls != null and #lists.size(post.extraImageUrls) > 0}"
            ></i>
          </div>

          <div class="card-body-ig">
            <div class="actions">
              <div class="left-actions">
                <div class="action-group">
                  <button type="button" class="btn-action btn-like" th:attr="data-id=${post.id}" title="좋아요">
                    <i class="bi" th:classappend="${post.likedByMe} ? ' bi-heart-fill' : ' bi-heart'"></i>
                  </button>
                  <span class="count like-count" th:attr="data-count=${post.recommendCount}">0</span>
                </div>
                <div class="action-group">
                  <button type="button" class="btn-action btn-comment" th:attr="data-id=${post.id}" title="댓글">
                    <i class="bi bi-chat"></i>
                  </button>
                  <span
                    class="ig-count"
                    id="igCommentCount"
                    th:attr="data-count=${post.commentCount}"
                    th:text="${post.commentCount}"
                    >0</span
                  >
                </div>
              </div>
              <div class="right-actions">
                <button type="button" class="btn-action btn-bookmark" th:attr="data-id=${post.id}" title="북마크">
                  <i class="bi" th:classappend="${post.bookmarkedByMe} ? ' bi-bookmark-fill' : ' bi-bookmark'"></i>
                </button>
              </div>
            </div>

            <div class="caption">
              <span class="name" th:text="${post.author.nickname}">닉네임</span>
              <span class="content" th:text="${post.content}">내용</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 페이징 -->
      <nav class="mt-4">
        <ul class="pagination justify-content-center">
          <!-- 첫 페이지 « -->
          <li class="page-item" th:classappend="${currentPage <= 1} ? ' disabled'">
            <a
              class="page-link"
              th:href="@{/community/list(page=${1}, type=${type}, keyword=${keyword}, styleNames=${styleNames})}"
              aria-label="첫 페이지"
              >«</a
            >
          </li>

          <!-- 이전 페이지 ‹ -->
          <li class="page-item" th:classappend="${currentPage <= 1} ? ' disabled'">
            <a
              class="page-link"
              th:href="@{/community/list(page=${currentPage - 1}, type=${type}, keyword=${keyword}, styleNames=${styleNames})}"
              aria-label="이전 페이지"
              >‹</a
            >
          </li>

          <!-- 숫자 페이지 -->
          <li
            class="page-item"
            th:each="i : ${#numbers.sequence(startPage, endPage)}"
            th:classappend="${i == currentPage} ? ' active'"
          >
            <a
              class="page-link"
              th:href="@{/community/list(page=${i}, type=${type}, keyword=${keyword}, styleNames=${styleNames})}"
              th:text="${i}"
              >1</a
            >
          </li>

          <!-- 다음 페이지 › -->
          <li class="page-item" th:classappend="${currentPage >= totalPages} ? ' disabled'">
            <a
              class="page-link"
              th:href="@{/community/list(page=${currentPage + 1}, type=${type}, keyword=${keyword}, styleNames=${styleNames})}"
              aria-label="다음 페이지"
              >›</a
            >
          </li>

          <!-- 마지막 페이지 » -->
          <li class="page-item" th:classappend="${currentPage >= totalPages} ? ' disabled'">
            <a
              class="page-link"
              th:href="@{/community/list(page=${totalPages}, type=${type}, keyword=${keyword}, styleNames=${styleNames})}"
              aria-label="마지막 페이지"
              >»</a
            >
          </li>
        </ul>
      </nav>
      
    </div>

    <!-- 모달은 body 바로 아래 -->
    <div
      class="modal fade"
      id="detailModal"
      data-bs-keyboard="true"
      data-bs-backdrop="true"
      tabindex="-1"
      aria-hidden="true"
      role="dialog"
    >
      <div class="modal-dialog modal-dialog-centered modal-xl" role="document"></div>
    </div>

    <div th:replace="fragments/footer :: footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/modalLoader.js"></script>
    <script src="/js/detail.js"></script>
    <script src="/js/list.js"></script>
    <script src="/js/chatfrag.js"></script>
  </body>
</html>
