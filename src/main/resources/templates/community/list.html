<!DOCTYPE html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>TempFit 커뮤니티</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/list.css" />
  </head>
  <body>
    <!-- 네비바 -->
    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="container px-4 px-lg-5 mt-5">
      <h1 class="mb-4">게시글 목록</h1>

      <!-- 검색 & 스타일 필터 + 글쓰기 버튼 -->
      <div class="d-flex justify-content-between align-items-start mb-3">
        <form
          class="search-form d-flex flex-column"
          th:action="@{/community/list}"
          method="get"
          style="gap: 8px"
        >
          <div class="d-flex" style="gap: 8px">
            <select name="type" class="form-select form-select-sm">
              <option value="">전체</option>
              <option value="t" th:selected="${type == 't'}">제목</option>
              <option value="a" th:selected="${type == 'a'}">작성자</option>
            </select>
            <input
              type="text"
              name="keyword"
              th:value="${keyword}"
              class="form-control form-control-sm"
              placeholder="검색어"
            />
            <button type="submit" class="btn btn-outline-secondary btn-sm">
              검색
            </button>
            <a
              th:href="@{/community/list}"
              class="btn btn-outline-secondary btn-sm reset-btn"
              >초기화</a
            >
          </div>
          <div
            class="btn-group btn-group-sm"
            role="group"
            aria-label="스타일 선택"
            style="margin-top: 8px"
          >
            <input
              type="radio"
              class="btn-check"
              name="styleNames"
              id="styleCasual"
              value="CASUAL"
              autocomplete="off"
              th:checked="${styleNames != null and styleNames.contains('CASUAL')}"
            />
            <label class="btn btn-outline-primary" for="styleCasual"
              >캐주얼</label
            >

            <input
              type="radio"
              class="btn-check"
              name="styleNames"
              id="styleStreet"
              value="STREET"
              autocomplete="off"
              th:checked="${styleNames != null and styleNames.contains('STREET')}"
            />
            <label class="btn btn-outline-primary" for="styleStreet"
              >스트리트</label
            >

            <input
              type="radio"
              class="btn-check"
              name="styleNames"
              id="styleFormal"
              value="FORMAL"
              autocomplete="off"
              th:checked="${styleNames != null and styleNames.contains('FORMAL')}"
            />
            <label class="btn btn-outline-primary" for="styleFormal"
              >포멀</label
            >

            <input
              type="radio"
              class="btn-check"
              name="styleNames"
              id="styleOutdoor"
              value="OUTDOOR"
              autocomplete="off"
              th:checked="${styleNames != null and styleNames.contains('OUTDOOR')}"
            />
            <label class="btn btn-outline-primary" for="styleOutdoor"
              >아웃도어</label
            >
          </div>
        </form>
        <a
          href="/community/create"
          class="btn btn-primary btn-sm ms-3 create-btn"
          sec:authorize="isAuthenticated()"
          >글쓰기</a
        >
      </div>
      <div th:fragment="postGrid(posts)">
      <!-- 게시글 카드 그리드 -->
      <div class="post-grid">
        <a
          th:each="post : ${list}"
          th:href="@{/community/detail/{id}(id=${post.id})}"
          class="post-card text-decoration-none text-reset"
        >
          <!-- 시간/상대시간 및 온도 -->
          <div
            class="card-time d-flex justify-content-between align-items-center px-3 pt-2"
          >
            <small class="text-muted" th:text="${post.displayDate}"></small>
            <div class="d-flex">
              <span
                class="badge bg-day me-1"
                th:text="${T(java.lang.Math).round(post.maxTemp) + '°'}"
              ></span>
              <span
                class="badge bg-night"
                th:text="${T(java.lang.Math).round(post.minTemp) + '°'}"
              ></span>
            </div>
          </div>

          <!-- 대표 이미지 -->
          <img
            th:if="${post.repImageUrl != null}"
            th:src="@{'/uploads/' + ${post.repImageUrl}}"
            alt="대표사진"
            class="card-img-top"
          />

          <!-- 카드 본문 -->
          <div class="card-body">
            <h5 class="card-title" th:text="${post.title}">제목</h5>
            <p class="card-subtitle" th:text="${post.author.nickname}">
              작성자
            </p>
            <div class="badge-list">
              <span th:if="${post.casual}" class="badge bg-secondary"
                >캐주얼</span
              >
              <span th:if="${post.street}" class="badge bg-secondary"
                >스트리트</span
              >
              <span th:if="${post.formal}" class="badge bg-secondary"
                >포멀</span
              >
              <span th:if="${post.outdoor}" class="badge bg-secondary"
                >아웃도어</span
              >
            </div>
          </div>
        </a>
      </div>
    </div>

      <!-- 페이징 -->
      <nav class="mt-4">
        <ul class="pagination justify-content-center">
          <li class="page-item" th:if="${startPage > 1}">
            <a
              class="page-link"
              th:href="@{/community/list(page=${startPage - 1}, type=${type}, keyword=${keyword}, styleNames=${styleNames})}"
              >이전</a
            >
          </li>
          <li
            class="page-item"
            th:each="i : ${#numbers.sequence(startPage, endPage)}"
            th:classappend="${i == currentPage} ? ' active'"
          >
            <a
              class="page-link"
              th:href="@{/community/list(page=${i}, type=${type}, keyword=${keyword}, styleNames=${styleNames})}"
              th:text="${i}"
              >1</a
            >
          </li>
          <li class="page-item" th:if="${endPage < totalPages}">
            <a
              class="page-link"
              th:href="@{/community/list(page=${endPage + 1}, type=${type}, keyword=${keyword}, styleNames=${styleNames})}"
              >다음</a
            >
          </li>
        </ul>
      </nav>
    </div>

    <div th:replace="fragments/footer :: footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll(".post-card").forEach((card) => {
          card.addEventListener("mouseenter", () => {
            card.style.transform = "scale(1.03)";
          });
          card.addEventListener("mouseleave", () => {
            card.style.transform = "scale(1)";
          });
        });
      });
    </script>
  </body>
</html>
