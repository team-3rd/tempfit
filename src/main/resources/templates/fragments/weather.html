<div th:fragment="weatherCard" class="col-12 col-lg-6 d-flex flex-column h-100">
  <div
    class="card shadow-sm mb-4 flex-grow-1"
    style="width: 100%; height: 546px"
  >
    <div class="card-body text-center" style="padding-bottom: 0.5rem">
      <!-- 지역 설정 -->
      <div id="weather-location" class="mt-2 loc">
        <ul class="address-list">
          <li class="list-li-left">
            <a href="javascript:doList()" class="do-btn">
              <span class="dosi"
                >도·시
                <img
                  class="img"
                  width="10"
                  height="10"
                  src="https://img.icons8.com/ios-filled/10/sort-down.png"
                  alt="sort-down"
                />
              </span>
            </a>
          </li>
          <li class="list-li-center">
            <a href="javascript:siList()" class="si-btn disabled">
              <span class="sigungu"
                >시·군·구
                <img
                  class="img"
                  width="10"
                  height="10"
                  src="https://img.icons8.com/ios-filled/10/sort-down.png"
                  alt="sort-down"
                />
              </span>
            </a>
          </li>
          <li class="list-li-right">
            <a class="loc-btn" href="javascript:refresh()"></a>
          </li>
        </ul>
      </div>
      <div class="layer-do hide">
        <ul class="list-do"></ul>
      </div>
      <div class="layer-si hide">
        <ul class="list-si"></ul>
      </div>

      <!-- 날씨 로딩 오버레이 -->
      <div
        id="weather-loading-overlay"
        class="loading-wrap"
        style="display: none"
      ></div>

      <!-- 날씨 로딩 스피너 -->
      <div
        id="weather-loading-spinner"
        class="loading-spinner"
        style="display: none"
      ></div>

      <!-- 날씨 로딩 텍스트 -->
      <div id="weather-loading-text" class="loading-text" style="display: none">
        날씨 정보 불러오는 중...
      </div>

      <!-- 현재 날씨 아이콘 -->
      <div
        id="weather-icon"
        style="font-size: 3rem; margin-bottom: 8px; margin-top: 5px"
      ></div>

      <!-- 현재 기온 -->
      <div
        id="weather-temp"
        style="font-size: 2.4rem; font-weight: bold; margin-bottom: 5px"
      ></div>

      <!-- 현재 날씨 - 하늘, 습도, 풍속 -->
      <div class="mLists">
        <dl class="mList">
          <div id="weather-sky" class="fw-bold"></div>
          <div id="weather-humid" style="margin-bottom: 2px"></div>
          <div id="weather-wind" style="margin-bottom: 2px"></div>
        </dl>
      </div>

      <!-- 시간별 날씨 -->
    </div>
    <div
      class="card-body p-2 text-center output form-floating mh"
      id="weather-list"
      style="border-top: 1px solid #eee"
    >
      <div class="inner">
        <ul class="ul"></ul>
        <button class="btn-prev hide" onclick="prevBtn()"></button>
        <button class="btn-next" onclick="nextBtn()"></button>
      </div>
    </div>
  </div>
</div>
