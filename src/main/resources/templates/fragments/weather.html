<div th:fragment="weatherCard" class="col-12 col-lg-6 d-flex flex-column h-100">
  <div
    class="card shadow-sm mb-4 flex-grow-1 w-100 position-relative"
    style="width: 100%; height: 527px"
  >
    <div
      class="card-body text-center"
      style="padding-bottom: 0.5rem; width: 100%; padding: 0"
    >
      <!-- 지역 설정 -->
      <div id="weather-location" class="loc">
        <div class="locations">
          <a href="javascript:doList()" class="do-btn">
            <span class="dosi"
              >도·시
              <i class="bi bi-caret-down-fill"></i>
            </span>
          </a>
          <a href="javascript:siList()" class="si-btn disabled">
            <span class="sigungu"
              >시·군·구
              <i class="bi bi-caret-down-fill"></i>
            </span>
          </a>
        </div>
        <div class="currentPos">
          <button
            class="btn btn-outline-secondary btn-sm loc-btn"
            onclick="currentPos()"
          >
            <i class="bi bi-crosshair"></i>
          </button>
        </div>
      </div>
      <div class="layer-do hide">
        <ul class="list-do"></ul>
      </div>
      <div class="layer-si hide">
        <ul class="list-si"></ul>
      </div>

      <!-- 날씨 로딩 오버레이 -->
      <div
        id="weather-loading-overlay"
        class="loading-wrap"
        style="display: none"
      ></div>

      <!-- 날씨 로딩 스피너 -->
      <div
        id="weather-loading-spinner"
        class="loading-spinner"
        style="display: none"
      ></div>

      <!-- 날씨 로딩 텍스트 -->
      <div id="weather-loading-text" class="loading-text" style="display: none">
        날씨 정보 불러오는 중...
      </div>

      <!-- 현재 날씨 아이콘 -->
      <div
        id="weather-icon"
        style="font-size: 3rem; margin-bottom: 8px; margin-top: 15px"
      ></div>

      <!-- 현재 기온 -->
      <div
        id="weather-temp"
        style="font-size: 2.4rem; font-weight: bold; margin-bottom: 5px"
      ></div>

      <!-- 현재 날씨 - 하늘, 습도, 풍속 -->
      <div class="mLists">
        <dl class="mList">
          <div id="weather-sky" class="fw-bold"></div>
          <div id="weather-humid" style="margin-bottom: 2px"></div>
          <div id="weather-wind" style="margin-bottom: 2px"></div>
        </dl>
      </div>

      <!-- 시간별 날씨 -->
    </div>
    <div
      class="card-body p-2 text-center output form-floating mh"
      id="weather-list"
      style="border-top: 1px solid #eee"
    >
      <div class="inner">
        <ul class="ul"></ul>
        <button class="btn-prev hide" onclick="prevBtn()">
          <i class="bi bi-chevron-left weather-scroll"></i>
        </button>
        <button class="btn-next" onclick="nextBtn()">
          <i class="bi bi-chevron-right weather-scroll"></i>
        </button>
      </div>
    </div>
  </div>
</div>
