<!-- src/main/resources/templates/chatbot.html -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TempFit 챗봇</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/chat.css}" />
  <link href="https://cdn.jsdelivr.net/npm/pretendard@latest/dist/web/variable/pretendardvariable.css" rel="stylesheet"/>

  <script defer src="/js/chatbot.js"></script>
</head>
<body class="bg-light d-flex flex-column min-vh-100">
  <th:block th:replace="fragments/navbar :: navbar"></th:block>
  <th:block th:replace="fragments/toggle :: toggle"></th:block>

  <!-- 서버/페이지 컨텍스트 -->
  <input type="hidden" id="ctxTemp" th:value="${ctxTemp}" />
  <input type="hidden" id="ctxLoc"  th:value="${ctxLoc}" />
  <input type="hidden" id="ctxDate" th:value="${ctxDate}" />
  <input type="hidden" id="ctxLat"  th:value="${ctxLat}" />
  <input type="hidden" id="ctxLon"  th:value="${ctxLon}" />
  <!-- ★ 로그인 여부 -->
  <input type="hidden" id="ctxLoggedIn" th:value="${isLoggedIn}" />

  <div class="container chat-container flex-grow-1 row">
    <div class="col-md-3">
      <div th:replace="~{fragments/chatUserList :: chatUserList(${chatUsers})}"></div>
    </div>
  <div class="col-md-9">
      <h4 class="mb-4 text-center">TempFit 챗봇</h4>

      <div class="chat-box shadow-sm mb-3" id="chatBox"></div>

      <div class="chat-input">
        <textarea id="msgInput" class="form-control" rows="1" placeholder="메시지를 입력하세요..."></textarea>
        <button id="sendBtn" class="btn btn-primary" type="button">보내기</button>
      </div>
    </div>
  </div>

  <th:block th:replace="fragments/footer :: footer"></th:block>
</body>
</html>
