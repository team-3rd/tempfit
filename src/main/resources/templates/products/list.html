<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title th:text="|${genderLabel} ${itemName.replace('-',' ')}|"></title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <link href="/css/styles.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body>
    <th:block th:replace="fragments/navbar :: navbar"></th:block>

    <div class="container py-4">
      <div class="d-flex align-items-center mb-4">
        <img
          th:if="${itemImagePath}"
          th:src="${itemImagePath}"
          th:alt="${itemName}"
          style="width: 100px; height: 100px; object-fit: cover; margin-right: 10px; border-radius: 4px"
        />
        <h2 class="mb-0" th:text="|${genderLabel} ${itemName}|">상품 보기</h2>
      </div>

      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
        <div th:each="prod : ${products}" class="col">
          <div class="card h-100 shadow-sm">
            <!-- 1) 이미지 클릭 시 내부 상세로 -->
            <div class="ratio ratio-1x1">
              <a th:href="@{/coordi/item/{key}(key=${prod.productKey})}">
                <img th:src="${prod.imageUrl}" class="img-fluid" style="object-fit: cover" alt="상품 이미지" />
              </a>
            </div>
            <div class="card-body">
              <!-- 2) 텍스트 클릭 시에도 내부 상세로 -->
              <a th:href="@{/coordi/item/{key}(key=${prod.productKey})}" style="text-decoration: none; color: inherit">
                <h5 class="card-title" th:text="${prod.brandName}">브랜드명</h5>
                <p class="card-text" th:text="${prod.productName}">상품명</p>
              </a>
            </div>
            <div class="card-footer bg-white border-top-0">
              <!-- 3) 외부 원본 상세 보기 -->
              <a th:if="${prod.linkUrl}" th:href="${prod.linkUrl}" class="btn btn-primary btn-sm w-100" target="_blank">
                원본 보기
              </a>
            </div>
          </div>
        </div>
      </div>

      <div class="text-center mt-4">
        <a href="/" class="btn btn-outline-secondary">← 뒤로 가기</a>
      </div>
    </div>

    <th:block th:replace="fragments/footer :: footer"></th:block>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
