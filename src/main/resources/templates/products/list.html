<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title th:text="|${genderLabel} ${itemName.replace('-',' ')}|"></title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <link href="/css/styles.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Pretendard Variable 웹폰트 (jsDelivr) -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      href="https://cdn.jsdelivr.net/npm/pretendard@latest/dist/web/variable/pretendardvariable.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <th:block th:replace="fragments/navbar :: navbar"></th:block>
    <th:block th:replace="fragments/toggle :: toggle"></th:block>

    <div class="container py-4">
      <div class="d-flex align-items-center mb-4">
        <img
          th:if="${itemImagePath}"
          th:src="${itemImagePath}"
          th:alt="${itemName}"
          style="width: 100px; height: 100px; object-fit: cover; margin-right: 10px; border-radius: 4px"
        />
        <h2 class="mb-0" th:text="|${genderLabel} ${itemName}|">상품 보기</h2>
      </div>
      <div class="text-center mt-2">
        <a href="/" class="btn btn-outline-secondary">뒤로 가기</a>
      </div>
    </div>

    <!-- 카드 전체 그리드 컨테이너 -->
    <div class="container py-5">
      <div class="row row-cols-5 g-5">
        <div class="col text-decoration-none text-reset" th:each="product : ${products}">
          <a th:href="${product.linkUrl}" target="_blank" class="text-decoration-none text-reset">
            <div class="card border shadow-sm" style="border-radius: 0">
              <img
                th:src="${product.imageUrl}"
                th:alt="${product.productName}"
                class="card-img-top"
                style="height: 200px; object-fit: contain; border-radius: 0"
              />
              <div class="card-body p-2">
                <p class="mb-1 fw-bold" style="font-size: 16px" th:text="${product.brandName}">브랜드명</p>
                <p
                  class="mb-0 card-text"
                  style="
                    font-size: 14px;
                    color: #000;
                    overflow: hidden;
                    display: -webkit-box;
                    -webkit-line-clamp: 2;
                    -webkit-box-orient: vertical;
                    min-height: 3em;
                  "
                  th:text="${product.productName}"
                >
                  상품명
                </p>
              </div>
            </div>
          </a>
        </div>

        <div class="col-12 text-center text-muted" th:if="${#lists.isEmpty(products)}">
          <p>등록된 상품이 없습니다.</p>
        </div>
      </div>
    </div>

    <th:block th:replace="fragments/footer :: footer"></th:block>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
