<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <!-- <title th:text="|${genderLabel} ${itemName.replace('-',' ')}|"></title> -->
     <title>상품보기 - TempFit</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <link href="/css/styles.css" rel="stylesheet" />
    <link href="/css/products.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Bootstrap Icons (아이콘 사용 필수) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Pretendard Variable 웹폰트 (jsDelivr) -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link href="https://cdn.jsdelivr.net/npm/pretendard@latest/dist/web/variable/pretendardvariable.css" rel="stylesheet" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <th:block th:replace="fragments/navbar :: navbar"></th:block>
    <th:block th:replace="fragments/toggle :: toggle"></th:block>

    <div class="container py-4">
      <div class="d-flex align-items-center mb-4">
        <img
          th:if="${itemImagePath}"
          th:src="${itemImagePath}"
          th:alt="${itemName}"
          style="width: 100px; height: 100px; object-fit: cover; margin-right: 10px; border-radius: 0"
        />
        <h2 class="mb-0" th:text="|${genderLabel} ${itemName}|">상품 보기</h2>
      </div>

      <div>
        <a href="/" class="btn btn-outline-secondary">↩돌아가기</a>
      </div>

      <!-- 상품 카드 그리드 -->
      <div class="products-grid">
        <div th:if="${#lists.isEmpty(products)}" class="no-products" style="grid-column: 1/-1">
          등록된 상품이 없습니다.
        </div>

        <div th:each="p : ${products}" class="product-card-wrapper">
          <!-- 카드 전체는 상품 링크 -->
          <a th:href="${p.linkUrl != null && !#strings.isEmpty(p.linkUrl) ? p.linkUrl : '#'}" target="_blank" class="card product-card mb-0">
            <div class="product-img-wrapper">
              <img th:src="${p.imageUrl}" alt="이미지" />
            </div>
            <div class="card-body">
              <div class="brand-name" th:text="${p.brandName}">브랜드</div>
              <div class="product-name text-truncate" th:text="${p.productName}">상품명</div>
            </div>
          </a>
          <button type="button" class="dib-btn btn-action" th:attr="data-id=${p.id}" title="찜" aria-pressed="false">
              <i class="bi bi-bag"></i>
            </button>
        </div>
      </div>

      <!-- 페이징 -->
      <div class="pagination-wrapper">
        <nav th:if="${totalPages != null && totalPages > 0}">
          <ul class="pagination">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
              <a class="page-link" th:href="@{|/products/${gender}?item=${itemName}&page=0|}" aria-label="첫 페이지">«</a>
            </li>
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
              <a class="page-link" th:href="@{|/products/${gender}?item=${itemName}&page=${currentPage - 1}|}" aria-label="이전">‹</a>
            </li>
            <li
              class="page-item"
              th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
              th:classappend="${i} == ${currentPage} ? 'active'"
            >
              <a class="page-link" th:href="@{|/products/${gender}?item=${itemName}&page=${i}|}" th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
              <a class="page-link" th:href="@{|/products/${gender}?item=${itemName}&page=${currentPage + 1}|}" aria-label="다음">›</a>
            </li>
            <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
              <a class="page-link" th:href="@{|/products/${gender}?item=${itemName}&page=${totalPages - 1}|}" aria-label="마지막 페이지">»</a>
            </li>
          </ul>
        </nav>
      </div>
    </div>

    <th:block th:replace="fragments/footer :: footer"></th:block>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      const dibIds = /*[[${dibIds}]]*/ [];
      
      document.querySelectorAll(".dib-btn").forEach((btn) => {
        const id = parseInt(btn.dataset.id);
        const icon = btn.querySelector(".bi");

        if (dibIds.includes(id)) {
          btn.classList.add("active");
          btn.setAttribute("aria-pressed", "true");
          icon.classList.remove("bi-bag");
          icon.classList.add("bi-bag-check-fill");
        }
      });

      // 클릭 이벤트
      document.addEventListener("click", (e) => {
        const btn = e.target.closest(".dib-btn");
        if (!btn) return;

        e.preventDefault();
        e.stopPropagation();

        const id = btn.getAttribute("data-id");
        const icon = btn.querySelector("i");
        const active = btn.classList.toggle("active");
        btn.setAttribute("aria-pressed", active ? "true" : "false");

        fetch(`/products/dibs/${id}`, { method: "POST", credentials: "same-origin" })
          .then((res) => {
            if (!res.ok) throw new Error("서버 오류");
            if (active) {
              icon.classList.remove("bi-bag");
              icon.classList.add("bi-bag-check-fill");
            } else {
              icon.classList.remove("bi-bag-check-fill");
              icon.classList.add("bi-bag");
            }
          })
          .catch((err) => console.error("찜 토글 실패", err));
      });
    </script>
  </body>
</html>
