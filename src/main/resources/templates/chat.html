<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8" />
  <title th:text="'채팅 - ' + ${receiver.nickname}">쪽지</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" th:href="@{/css/chat.css}" />
  <link
      href="https://cdn.jsdelivr.net/npm/pretendard@latest/dist/web/variable/pretendardvariable.css"
      rel="stylesheet"
    />

  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
  <script src="/js/chat.js"></script>
</head>

<body class="bg-light d-flex flex-column min-vh-100">
  <th:block th:replace="fragments/navbar :: navbar"></th:block>
  <th:block th:replace="fragments/toggle :: toggle"></th:block>

  <div class="container chat-container flex-grow-1">
    <input type="hidden" id="senderEmail" th:value="${sender.email}" />
    <input type="hidden" id="receiverEmail" th:value="${receiver.email}" />

    <h4 class="mb-4 text-center" th:text="${receiver.nickname} + ' 님의 채팅'">대화상대</h4>

    <div class="chat-box shadow-sm mb-3" id="chatBox">
      <div th:each="msg : ${messages}" th:class="|message-row ${msg.sender.email == sender.email ? 'message-right' : 'message-left'}|">
        <div th:class="|bubble ${msg.sender.email == sender.email ? 'bubble-right' : 'bubble-left'}|" th:text="${msg.content}">메시지 내용</div>
        <div class="timestamp" th:text="${#temporals.format(msg.sentAt, 'yyyy-MM-dd HH:mm')}">시간</div>
      </div>
    </div>

    <div class="chat-input">
      <textarea id="msgInput" class="form-control" rows="2" placeholder="메시지를 입력하세요"></textarea>
      <button id="sendBtn" class="btn btn-primary">발송</button>
    </div>
  </div>

  <th:block th:replace="fragments/footer :: footer"></th:block>
</body>
</html>
