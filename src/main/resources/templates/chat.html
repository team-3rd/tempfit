<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8" />
  <title th:text="'채팅 - ' + ${receiver.nickname}">쪽지</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" th:href="@{/css/chat.css}" />

  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
  <script src="/js/chat.js"></script>
</head>
<body>
  <input type="hidden" id="senderEmail" th:value="${sender.email}" />
  <input type="hidden" id="receiverEmail" th:value="${receiver.email}" />

  <h3 th:text="'대화상대: ' + ${receiver.nickname}">대화상대</h3>

  <div class="chat-box mb-3" id="chatBox">
    <div th:each="msg : ${messages}">
      <div th:class="${msg.sender.email == sender.email} ? 'message-right' : 'message-left'">
        <div class="message" th:text="${msg.content}">메시지 내용</div>
        <div class="text-muted small" th:text="${#temporals.format(msg.sentAt, 'yyyy-MM-dd HH:mm')}">시간</div>
      </div>
    </div>
  </div>

  <div class="chat-input">
    <textarea id="msgInput" class="form-control" rows="2" required placeholder="메시지를 입력하세요"></textarea>
    <button id="sendBtn" class="btn btn-primary">보내기</button>
  </div>
</body>
</html>
