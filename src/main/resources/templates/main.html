<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>템핏 TempFit - 날씨 기반 의상 추천</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <link
      href="https://cdn.jsdelivr.net/npm/pretendard@latest/dist/web/variable/pretendardvariable.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="/css/darkmode.css" rel="stylesheet" />
    <link href="css/styles.css" rel="stylesheet" />
    <link href="css/main.css" rel="stylesheet" />
    <!-- Pretendard Variable 웹폰트 (jsDelivr) -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <script th:if="${initialGender != null}" th:inline="javascript">
      /*<![CDATA[*/
      window.initialGender = /*[[${initialGender}]]*/ "male";
      /*]]>*/
    </script>
  </head>
  <body>
    <!-- Navbar -->
    <th:block th:replace="fragments/navbar :: navbar"></th:block>
    <th:block th:replace="fragments/toggle :: toggle"></th:block>

    <div class="container px-4 px-lg-5">
      <!-- 1) 상단: 날씨 카드 + 추천 코디 -->
      <div class="row g-4 g-lg-5 align-items-start mt-4 mt-lg-2 mb-2 mb-lg-3">
        <!-- 날씨 카드 (fragment 호출) -->
        <th:block th:replace="fragments/weather :: weatherCard"></th:block>

        <!-- 오늘의 추천 코디 카드 (수정된 부분) -->
        <div class="col-12 col-lg-6 d-flex flex-column h-100">
          <div class="card shadow-sm mb-4 flex-grow-1 w-100 position-relative">
            <div class="card-body d-flex flex-column align-items-center justify-content-start h-100 position-relative">
              <!-- 성별 버튼 -->
              <button
                id="toggle-gender-btn"
                class="btn btn-outline-secondary btn-sm position-absolute control-btn"
                style="top: 0.5rem; left: 0.5rem"
              >
                <i class="bi bi-gender-male text-primary"></i>
              </button>

              <!-- 컬러 추천 버튼 -->
              <!-- <button
                id="color-btn"
                class="btn btn-outline-secondary btn-sm position-absolute control-btn"
                style="top: 0.5rem; left: 3.5rem"
              >
                <i class="bi bi-palette"></i>
              </button> -->

              <!-- AI 버튼 -->
              <button
                id="ai-btn"
                class="btn btn-outline-secondary btn-sm position-absolute control-btn"
                style="top: 0.5rem; right: 3.5rem"
              >
                <i class="bi bi-openai text-dark"></i>
              </button>

              <!-- 리프레시 버튼 -->
              <button
                id="refresh-images-btn"
                class="btn btn-outline-secondary btn-sm position-absolute control-btn"
                style="top: 0.5rem; right: 0.5rem"
              >
                <i class="bi bi-shuffle"></i>
              </button>

              <!-- 로딩 오버레이 -->
              <div id="guide-loading-overlay" class="loading-wrap" style="display: none"></div>

              <!-- 로딩 스피너 -->
              <div id="guide-loading-spinner" class="loading-spinner" style="display: none"></div>

              <!-- 로딩 텍스트 -->
              <div id="guide-loading-text" class="loading-text" style="display: none">추천 코디 불러오는 중...</div>

              <h2 class="mb-3 text-center" style="font-size: 1.6rem; font-weight: 500; letter-spacing: -1px">
                【 오늘의 추천 코디 】
              </h2>
              <!-- 성별 라벨: JS 에서 동적으로 채워넣음 -->
              <div id="gender-label" class="text-center mb-2" style="font-size: 1.3rem; font-weight: 600">
                <!-- 여기에 <남성> 또는 <여성><br/><br/> 이 채워짐 -->
              </div>
              <!-- 2×2 그리드: 위행(outer, top) · 아래행(bottom, shoes) -->
              <div id="clothing-guide" class="d-flex flex-column" style="gap: 16px">
                <!-- 위쪽 행: 상의 · 아우터 -->
                <div id="clothing-guide-row1" class="d-flex justify-content-center" style="gap: 16px"></div>

                <!-- 아래쪽 행: 하의 · 신발 -->
                <div id="clothing-guide-row2" class="d-flex justify-content-center" style="gap: 16px"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 2) BEST LOOKS -->
      <div class="row mb-4">
        <div class="col-12">
          <div class="card shadow-sm">

              <div class="text-center mb-4">
                            <div class="card-body p-4">
              <!-- 로딩 오버레이 -->
              <div id="best-loading-overlay" class="loading-wrap" style="display: none"></div>

              <!-- 로딩 스피너 -->
              <div id="best-loading-spinner" class="loading-spinner" style="display: none"></div>

              <!-- 로딩 텍스트 -->
              <div id="best-loading-text" class="loading-text" style="display: none">베스트룩 불러오는 중...</div>
                <div class="best-looks-title-box" title="일주일마다 초기화 됩니다.">
                  <div class="current-temp-text1">
                    현재 온도 기준( <span id="current-temp-tag" class="current-temp-tag">-℃</span>
                    <span class="current-temp-text2">)</span>
                  </div>
                  <div class="style-best">
                   <span class="best-looks"><i class="bi bi-trophy-fill text-warning"></i>명예의 전당<i class="bi bi-trophy-fill text-warning"></i></span>
                  </div>
                </div>
              </div>
              <div id="best-looks-area" class="row g-4 gx-lg-5 mt-4 ms-3">
                <th:block th:each="entry : ${postsByStyle}">
                  <div class="col-12 col-sm-6 col-lg-3 d-flex align-items-stretch">
                    <div class="card shadow-sm w-100 d-flex flex-column">
                      <!-- 스타일명 헤더 -->
                      <div class="card-style-header" th:text="${entry.key}">STYLE</div>
                      <div class="card-body d-flex flex-column align-items-center justify-content-start flex-grow-1">
                        <div th:if="${entry.value.size() > 0}">
                          <a th:href="@{/community/detail/{id}(id=${entry.value[0].id})}">
                            <img
                              th:src="@{/uploads/{f}(f=${entry.value[0].repImageUrl})}"
                              class="mb-3"
                              style="max-width: 130px; max-height: 130px; border-radius: 10px"
                              alt="코디 이미지"
                            />
                          </a>
                          <div class="post-title mb-2" th:text="${entry.value[0].title}">제목</div>
                          <div class="badge-list mb-2">
                            <span th:if="${entry.value[0].casual}" class="badge bg-secondary me-1">캐주얼</span>
                            <span th:if="${entry.value[0].formal}" class="badge bg-secondary me-1">포멀</span>
                            <span th:if="${entry.value[0].street}" class="badge bg-secondary me-1">스트리트</span>
                            <span th:if="${entry.value[0].outdoor}" class="badge bg-secondary me-1">기타</span>
                          </div>
                          <div class="text-muted mb-1" th:text="${entry.value[0].author.nickname}">익명</div>
                          <div class="text-muted mb-3" th:text="'추천수: ' + ${entry.value[0].recommendCount}">
                            추천수: 0
                          </div>
                        </div>
                        <div
                          th:unless="${entry.value.size() > 0}"
                          class="d-flex align-items-center justify-content-center flex-grow-1"
                        >
                          <div class="text-muted">게시글 없음</div>
                        </div>
                      </div>
                      <div class="card-footer bg-white border-top-0">
                        <a
                          th:href="@{/community/list(type='',keyword='',styleNames=${entry.key})}"
                          class="btn btn-primary btn-sm w-100"
                          th:text="${entry.key} + ' 게시글 보기'"
                        >
                          게시글 보기
                        </a>
                      </div>
                    </div>
                  </div>
                </th:block>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <th:block th:replace="fragments/footer :: footer"></th:block>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/weather.js"></script>
    <script src="js/main.js"></script>
    <script src="js/address.js"></script>
    <script src="js/weatherLoad.js" type="module"></script>
  </body>
</html>
